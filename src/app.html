<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#ffffff" id="theme-color" />
		<script>
			(() => {
				try {
					const k = 'nc-theme';
					const s = localStorage.getItem(k);
					const t =
						s === 'light' || s === 'dark'
							? s
							: window.matchMedia('(prefers-color-scheme: dark)').matches
								? 'dark'
								: 'light';
					document.documentElement.classList.toggle('dark', t === 'dark');
					document.documentElement.classList.toggle('light', t === 'light');
					const m = document.getElementById('theme-color');
					if (m) m.setAttribute('content', t === 'light' ? '#ffffff' : '#09090b');
				} catch {}
			})();
		</script>
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "NiftyCASino",
				"url": "https://niftycasino.niftychronicles.com/",
				"applicationCategory": "GameApplication",
				"operatingSystem": "Web",
				"description": "Forecast how NIFTY 50, BANKNIFTY and SENSEX close in SEBI's Closing Auction Session. Play-money chips, daily 15:15–15:20 IST.",
				"offers": { "@type": "Offer", "price": "0", "priceCurrency": "INR" }
			}
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="min-h-screen bg-slate-50 text-zinc-900 antialiased dark:bg-felt-950 dark:text-zinc-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
